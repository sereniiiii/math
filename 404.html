<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>页面不存在 · 高三数学</title>
<meta http-equiv="refresh" content="3; url=/math/" />
<style>
  :root {
    --page-bg: #e9eef5;
    --panel: #ffffff;
    --ink: #10151b;
    --ink-3: #78859a;
    --blue: #2a56c6;
    --line: #cfd9e6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--page-bg);
    color: var(--ink);
    font-family: "PingFang SC", "Hiragino Sans GB", -apple-system,
                 BlinkMacSystemFont, "Microsoft YaHei", sans-serif;
  }
  .box {
    width: 100%;
    max-width: 460px;
    padding: 34px 30px 30px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    text-align: center;
  }
  h1 { margin: 0 0 10px; font-size: 20px; font-weight: 600; letter-spacing: 0.5px; }
  p { margin: 0 0 8px; font-size: 13.5px; line-height: 1.8; color: var(--ink-3); }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px;
    color: var(--blue);
    word-break: break-all;
  }
  a.btn {
    display: inline-block;
    margin-top: 16px;
    padding: 9px 20px;
    border-radius: 9px;
    background: var(--blue);
    color: #fff;
    font-size: 13.5px;
    text-decoration: none;
  }
  a.btn:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="box">
    <h1>这个地址没有页面</h1>
    <p>3 秒后自动回到入口，也可以直接点下面的按钮。</p>
    <p><code id="bad"></code></p>
    <a class="btn" href="/math/">回到入口</a>
  </div>
  <script>
    var el = document.getElementById('bad');
    if (el && location.pathname) el.textContent = location.pathname;
  </script>
</body>
</html>
