<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>高三数学知识点清单</title>
<meta name="description" content="新高考数学全部模块知识点：核心结论、关键公式、易错提醒、典型例题。可勾选已掌握，自动记录进度。" />
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>

<div class="shell">

  <aside class="side">
    <div class="side-top">
      <div class="side-head">
        <h1>高三数学</h1>
        <p>知识点清单</p>
      </div>

      <div class="prog">
        <div class="prog-top">
          <b id="pct">0%</b>
          <span>已掌握</span>
        </div>
        <div class="prog-bar" aria-hidden="true"><i id="bar"></i></div>
      </div>
    </div>

    <nav id="tabs" class="tabs no-anim"></nav>

    <div class="side-tools">
      <input id="q" type="search" placeholder="搜知识点 / 公式 / 易错点" autocomplete="off" />
      <label class="switch">
        <input id="onlyTodo" type="checkbox" />
        <span>只看没掌握的</span>
      </label>
      <button id="reset" class="ghost" type="button">清空进度</button>
    </div>

    <p class="side-foot">勾选即存本地，共 <b id="total">0</b> 条</p>
    <a class="side-link" href="../">← 返回目录</a>
  </aside>

  <main id="list"></main>

</div>

<script src="assets/data.js"></script>
<script src="assets/fig.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
